[project]
name = "ragnarok-agent"
version = "0.1.0"
description = "Python agent service for RAGnarok v0.2 (agentic retrieval)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PT", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of tests
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
