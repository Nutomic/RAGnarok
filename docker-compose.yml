services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragnarok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragnarok
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnarok -d ragnarok"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ragnarok:${POSTGRES_PASSWORD}@db:5432/langfuse
      NEXTAUTH_URL: http://127.0.0.1:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      # Provision org, project and API key on startup; the app uses the same key.
      LANGFUSE_INIT_ORG_ID: ragnarok
      LANGFUSE_INIT_ORG_NAME: ragnarok
      LANGFUSE_INIT_PROJECT_ID: ragnarok
      LANGFUSE_INIT_PROJECT_NAME: RAGnarok
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # Optional UI login (owner of the provisioned org).
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:3001:3000"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      langfuse:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ragnarok:${POSTGRES_PASSWORD}@db:5432/ragnarok
      LANGFUSE_DATABASE_URL: postgresql://ragnarok:${POSTGRES_PASSWORD}@db:5432/langfuse
      LANGFUSE_SALT: ${LANGFUSE_SALT}
      LANGFUSE_HOST: http://langfuse:3000
      # Keys shared with the Langfuse INIT_* provisioning above; generate like the
      # other secrets, see .env.example.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
